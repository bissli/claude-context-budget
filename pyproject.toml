[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
bump2version = "^1.0.1"
pytest = "^8.0"
mutmut = "^3.7.0"

[tool.mutmut]
source_paths = [
    "scripts/hq.py",
    "scripts/handoff_gate.py",
    "scripts/handoff_stop.py",
]
also_copy = ["skills", "pytest.ini", "hooks"]
pytest_add_cli_args_test_selection = [
    "tests/test_hq_rules.py",
    "tests/test_hq_verbs.py",
    "tests/test_hq_invariants.py",
    "tests/test_handoff_hooks.py",
    "tests/test_hq_stamp_paths.py",
    "tests/test_hq_cycle_path.py",
    "tests/test_hq_adopt_read.py",
    "tests/test_hq_settlement.py",
    "tests/test_hq_mutants_adopt.py",
    "tests/test_hq_mutants_cycle.py",
    "tests/test_hq_mutants_stamp.py",
    "tests/test_hq_mutants_read.py",
    "tests/test_handoff_hooks_mutants.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
